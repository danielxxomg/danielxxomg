    <g transform="translate(0, 56)">
      <path class="icon" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm1-5.5a1 1 0 1 1-2 0v-3a1 1 0 1 1 2 0v3z" transform="scale(0.8)"/>
